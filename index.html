<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Macro Bars</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macros">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, three identical rows (label + numbers, bar, two steppers). Single dark look. */
:root{
  --bg:#0b0b0d; --panel:#16161a; --line:#2a2a31; --fg:#ececf0; --mute:#8b8b96;
  --fill:#e8442e; --over:#f2a33a; --goal:#4d7cff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-tap-highlight-color:transparent;user-select:none}
main{max-width:460px;margin:0 auto;padding-inline:20px;padding-block:28px;display:flex;flex-direction:column;gap:34px}
.row{display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.name{font-size:26px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nums{font-family:var(--mono);font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.nums b{color:var(--fg);font-weight:500}
.goalbtn{background:none;border:0;color:inherit;font:inherit;padding:0;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.bar{position:relative;height:34px;border-radius:17px;background:var(--panel);border:1.5px solid var(--line);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--fill);border-radius:17px 0 0 17px;transition:width .25s ease}
.fill.over{background:var(--over)}
.goal{position:absolute;top:-2px;bottom:-2px;left:70%;border-left:3px dotted var(--goal)}
.steps{display:flex;justify-content:space-between;align-items:center;gap:8px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--mono);font-size:20px;cursor:pointer}
.step button:active{background:var(--line)}
.step button:focus-visible,.goalbtn:focus-visible{outline:2px solid var(--goal);outline-offset:2px}
.step span{min-width:24px;text-align:center;font-family:var(--mono);font-size:16px;color:var(--mute)}
.add{position:relative;flex:1;min-width:0;max-width:110px;height:40px;border-radius:20px;border:1.5px solid var(--line);background:var(--panel);color:var(--mute);font-family:var(--mono);font-size:14px;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;display:flex;align-items:center;justify-content:center;padding:0}
.add.armed{background:var(--fill);border-color:var(--fill);color:#fff;text-transform:none}
.add .prog{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.28)}
.add.holding .prog{width:100%;transition:width .6s linear}
.add input{width:100%;height:100%;background:transparent;border:0;color:var(--fg);font-family:var(--mono);font-size:16px;text-align:center;outline:none}
.add input::-webkit-inner-spin-button,.add input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.add input{-moz-appearance:textfield}
.add .lbl{position:relative}
.rows{display:flex;flex-direction:column;gap:34px}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:env(safe-area-inset-bottom)}
.plus{width:52px;height:52px;border-radius:26px;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--mono);font-size:28px;line-height:1;cursor:pointer}
.plus:active{background:var(--line)}
.del{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;padding:0 0 0 10px;cursor:pointer;vertical-align:middle}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--panel);border:1.5px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none;visibility:visible;transition-delay:0s}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
.opt{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;padding:0 16px;cursor:pointer}
.opt small{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;text-transform:none}
.cform{display:none;grid-template-columns:1fr 72px 80px;gap:8px}
.sheet.custom .cform{display:grid}
.cform input{min-width:0;height:44px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;color:var(--fg);font-family:var(--mono);font-size:16px;padding:0 10px}
.cform input:focus{outline:none;border-color:var(--goal)}
.go{grid-column:1/-1;height:48px;border-radius:14px;border:0;background:var(--fill);color:#fff;font-family:var(--mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.reset{background:none;border:0;color:var(--mute);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px;cursor:pointer}
.edit{display:flex;gap:8px;align-items:center}
.edit input{width:90px;background:var(--panel);border:1.5px solid var(--goal);border-radius:8px;color:var(--fg);font-family:var(--mono);font-size:14px;padding:4px 6px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<main id="app"></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Add bar">
  <div class="grab"></div>
  <button class="opt" data-pre="0">Caffeine <small>mg</small></button>
  <button class="opt" data-pre="1">Creatine <small>g</small></button>
  <button class="opt" id="cust">Custom <small>name + unit</small></button>
  <div class="cform"><input id="cn" placeholder="Name" maxlength="20" autocomplete="off"><input id="cu" placeholder="Unit" maxlength="6" autocomplete="off"><input id="cg" type="number" inputmode="numeric" placeholder="Goal"><button class="go" id="go">Add bar</button></div>
</div>

<script>
const BASE=[{k:"cal",name:"Calories",unit:"kcal",goal:2200},{k:"carb",name:"Carbs",unit:"g",goal:250},{k:"pro",name:"Protein",unit:"g",goal:160}];
const GOAL_POS=0.7; // goal line sits at 70% of the bar, like the sketch
const today=()=>new Date().toLocaleDateString("en-CA");
function load(){try{return JSON.parse(localStorage.getItem("macros"))}catch(e){return null}}
function save(){try{localStorage.setItem("macros",JSON.stringify(S))}catch(e){}}
let S=load()||{date:today(),v:{},g:{}};
S.x??=[];
let DEF=[...BASE,...S.x];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
DEF.forEach(d=>{S.v[d.k]??=0;S.g[d.k]??=d.goal});
function rollover(){if(S.date!==today()){S.date=today();DEF.forEach(d=>S.v[d.k]=0);save()}}
rollover();
const app=document.getElementById("app");
const rowHTML=(d,x)=>`
<section class="row" data-k="${d.k}">
  <div class="head"><span class="name">${esc(d.name)}${x?`<button class="del" data-del="${d.k}" aria-label="Remove ${esc(d.name)}">&times;</button>`:""}</span><span class="nums" id="n-${d.k}"></span></div>
  <div class="bar"><div class="fill" id="f-${d.k}"></div><div class="goal"></div></div>
  <div class="steps">
    <div class="step"><button data-d="-10" aria-label="Minus 10 ${esc(d.name)}">&minus;</button><span>10</span><button data-d="10" aria-label="Plus 10 ${esc(d.name)}">+</button></div>
    <div class="add" id="a-${d.k}" role="button" tabindex="0" aria-label="Add custom ${esc(d.name)}"><span class="prog"></span><span class="lbl">Add</span></div>
    <div class="step"><button data-d="-5" aria-label="Minus 5 ${esc(d.name)}">&minus;</button><span>5</span><button data-d="5" aria-label="Plus 5 ${esc(d.name)}">+</button></div>
  </div>
</section>`;
app.innerHTML=`<div class="rows" id="rows">${DEF.map(d=>rowHTML(d,!BASE.includes(d))).join("")}</div><div class="foot"><button class="plus" id="plus" aria-label="Add bar">+</button><button class="reset" id="reset">Reset today</button></div>`;
const rowsEl=document.getElementById("rows");
function render(){
  DEF.forEach(d=>{
    const v=S.v[d.k],g=S.g[d.k],max=g/GOAL_POS;
    const f=document.getElementById("f-"+d.k);
    f.style.width=Math.min(v/max,1)*100+"%";
    f.classList.toggle("over",v>g);
    const n=document.getElementById("n-"+d.k);
    if(!n.querySelector("input"))n.innerHTML=`<b>${v.toLocaleString()}</b> / <button class="goalbtn" data-goal="${d.k}" aria-label="Edit ${d.name} goal">${g.toLocaleString()}</button> ${esc(d.unit)}`;
  });
}
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  rollover();
  if(b.id==="plus"){openSheet();return}
  if(b.dataset.del){
    const k=b.dataset.del,d=DEF.find(r=>r.k===k);
    if(!confirm("Remove "+d.name+"?"))return;
    S.x=S.x.filter(r=>r.k!==k);DEF=DEF.filter(r=>r.k!==k);delete S.v[k];delete S.g[k];save();
    b.closest(".row").remove();return;
  }
  if(b.dataset.d){const k=b.closest(".row").dataset.k;S.v[k]=Math.max(0,S.v[k]+ +b.dataset.d);save();render();return}
  if(b.id==="reset"){if(b.dataset.arm){DEF.forEach(d=>S.v[d.k]=0);save();render();b.textContent="Reset today";delete b.dataset.arm}else{b.dataset.arm=1;b.textContent="Tap again to reset";setTimeout(()=>{b.textContent="Reset today";delete b.dataset.arm},2500)}return}
  if(b.dataset.goal){
    const k=b.dataset.goal,n=document.getElementById("n-"+k);
    n.innerHTML=`<span class="edit">Goal <input id="g-${k}" type="number" inputmode="numeric" value="${S.g[k]}"></span>`;
    const i=n.querySelector("input");i.focus();i.select();
    const done=()=>{const x=parseInt(i.value,10);if(x>0)S.g[k]=x;save();n.innerHTML="";render()};
    i.addEventListener("blur",done,{once:true});
    i.addEventListener("keydown",ev=>{if(ev.key==="Enter")i.blur()});
  }
});

const HOLD=600;
function pillIdle(p){p.className="add";p.dataset.amt="";p.innerHTML='<span class="prog"></span><span class="lbl">Add</span>'}
function pillArmed(p,n){p.className="add armed";p.dataset.amt=n;p.innerHTML='<span class="prog"></span><span class="lbl">+'+n.toLocaleString()+'</span>'}
function pillEdit(p){
  const cur=p.dataset.amt||"";p.className="add editing";
  p.innerHTML='<input id="in-'+p.id+'" type="number" inputmode="numeric" min="1" value="'+cur+'" aria-label="Custom amount">';
  const i=p.querySelector("input");i.focus();i.select();
  let fin=false;const done=()=>{if(fin)return;fin=true;const n=parseInt(i.value,10);n>0?pillArmed(p,n):pillIdle(p)};
  i.addEventListener("blur",done);
  i.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter")done()});
}
function wirePill(p){
  let t=null,held=false;
  p.addEventListener("contextmenu",e=>e.preventDefault());
  p.addEventListener("pointerdown",e=>{
    if(!p.classList.contains("armed"))return;
    held=false;p.classList.add("holding");
    t=setTimeout(()=>{held=true;rollover();const k=p.id.slice(2);S.v[k]+= +p.dataset.amt;save();render();if(navigator.vibrate)navigator.vibrate(20);pillIdle(p)},HOLD);
  });
  const cancel=()=>{clearTimeout(t);p.classList.remove("holding")};
  p.addEventListener("pointerleave",cancel);p.addEventListener("pointercancel",cancel);
  p.addEventListener("pointerup",()=>{
    cancel();
    if(held){held=false;return}
    if(!p.classList.contains("editing"))pillEdit(p);
  });
  p.addEventListener("keydown",e=>{if(e.key==="Enter"&&!p.classList.contains("editing")){e.preventDefault();pillEdit(p)}});
}
document.querySelectorAll(".add").forEach(wirePill);

/* Bottom sheet: presets + custom bar */
const PRE=[{name:"Caffeine",unit:"mg",goal:400},{name:"Creatine",unit:"g",goal:5}];
const sh=document.getElementById("sheet"),cn=document.getElementById("cn"),cu=document.getElementById("cu"),cg=document.getElementById("cg");
function openSheet(){sh.classList.remove("custom");document.body.classList.add("sheet-open")}
function closeSheet(){document.body.classList.remove("sheet-open")}
function addRow(d){
  S.x.push(d);DEF.push(d);S.v[d.k]=0;S.g[d.k]=d.goal;save();
  rowsEl.insertAdjacentHTML("beforeend",rowHTML(d,true));
  const r=rowsEl.lastElementChild;wirePill(r.querySelector(".add"));render();
  setTimeout(()=>r.scrollIntoView({behavior:"smooth",block:"center"}),300);
}
document.getElementById("scrim").addEventListener("click",closeSheet);
sh.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.pre!==undefined){addRow({k:"x"+Date.now(),...PRE[+b.dataset.pre]});closeSheet();return}
  if(b.id==="cust"){sh.classList.add("custom");cn.focus();return}
  if(b.id==="go"){
    const name=cn.value.trim(),unit=cu.value.trim();
    if(!name||!unit){(name?cu:cn).focus();return}
    addRow({k:"x"+Date.now(),name,unit,goal:parseInt(cg.value,10)>0?parseInt(cg.value,10):100});
    cn.value=cu.value=cg.value="";closeSheet();
  }
});
sh.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")document.getElementById("go").click()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){rollover();render()}});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
